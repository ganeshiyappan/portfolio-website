<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ganesh Iyappan - Data Analyst & Business Intelligence Developer </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0D0D0F;
  --surface: #141416;
  --surface2: #1C1C1F;
  --surface3: #242428;
  --text: #F0EEE8;
  --muted: #9A9894;
  --hint: #5A5855;
  --accent: #C8A96E;
  --accent2: #8FB4D4;
  --accent3: #7DC4A0;
  --border: rgba(240,238,232,0.08);
  --border2: rgba(240,238,232,0.14);
  --radius: 8px;
  --radius-lg: 14px;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'Outfit', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;min-height:100vh}
/* NAV */
nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 3rem;height:62px;background:rgba(13,13,15,0.88);backdrop-filter:blur(16px);border-bottom:0.5px solid var(--border)}
.logo{font-family:var(--font-display);font-size:18px;color:var(--text);letter-spacing:-0.01em}
.logo span{color:var(--accent)}
.nav-links{display:flex;gap:2rem}
.nav-links a{font-size:13px;font-weight:400;color:var(--muted);text-decoration:none;letter-spacing:0.03em;transition:color 0.2s}
.nav-links a:hover{color:var(--text)}
.nav-badge{font-size:11px;font-weight:500;padding:3px 10px;background:rgba(124,196,160,0.12);color:var(--accent3);border:0.5px solid rgba(124,196,160,0.25);border-radius:100px;letter-spacing:0.04em}
/* VIEW COUNTER */
footer p{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.view-pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10.5px;color:var(--accent);background:rgba(200,169,110,0.1);border:0.5px solid rgba(200,169,110,0.2);border-radius:100px;padding:3px 10px;letter-spacing:0.03em}
/* HERO */
.hero{padding:6rem 3rem 4rem;max-width:1160px;margin:0 auto;display:grid;grid-template-columns:1fr 380px;gap:4rem;align-items:start}
.hero-tag{font-family:var(--font-mono);font-size:11px;color:var(--accent);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:1.5rem;display:flex;align-items:center;gap:8px}
.hero-tag::before{content:'';width:28px;height:1px;background:var(--accent)}
.hero h1{font-family:var(--font-display);font-size:clamp(2.6rem,3.8vw,3.8rem);line-height:1.08;font-weight:500;letter-spacing:-0.03em;margin-bottom:1.5rem}
.hero h1 .line2{font-style:italic;color:var(--accent)}
.hero-bio{font-size:15px;color:var(--muted);line-height:1.8;max-width:480px;margin-bottom:2.5rem;font-weight:300}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:3rem}
.btn{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;padding:10px 20px;border-radius:var(--radius);text-decoration:none;letter-spacing:0.02em;transition:all 0.2s;cursor:pointer;border:none}
.btn-primary{background:var(--accent);color:#0D0D0F}
.btn-primary:hover{background:#D4B87A}
.btn-ghost{background:transparent;color:var(--muted);border:0.5px solid var(--border2)}
.btn-ghost:hover{color:var(--text);border-color:var(--border2)}
.contact-items{display:flex;flex-direction:column;gap:10px}
.contact-item{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);text-decoration:none;transition:color 0.2s}
.contact-item:hover{color:var(--text)}
.contact-icon{width:32px;height:32px;background:var(--surface2);border:0.5px solid var(--border);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.contact-icon svg{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:1.8}
/* HERO RIGHT */
.hero-stats{display:flex;flex-direction:column;gap:12px}
.stat-big{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem}
.stat-big .num{font-family:var(--font-display);font-size:3rem;line-height:1;color:var(--accent);margin-bottom:6px}
.stat-big .lbl{font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0.04em}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat-sm{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem}
.stat-sm .num{font-family:var(--font-display);font-size:2rem;color:var(--accent2);line-height:1;margin-bottom:4px}
.stat-sm .lbl{font-size:11px;color:var(--muted)}
/* DIVIDER */
.divider{height:0.5px;background:var(--border);max-width:1160px;margin:0 auto}
/* SECTION */
.section-wrap{max-width:1160px;margin:0 auto;padding:0 3rem}
.main-grid{display:grid;grid-template-columns:1fr 340px;gap:2.5rem;padding:3rem 0 5rem;align-items:start}
.sec-label{font-family:var(--font-mono);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--hint);margin-bottom:1.5rem;display:flex;align-items:center;gap:10px}
.sec-label::after{content:'';flex:1;height:0.5px;background:var(--border)}
.section{margin-bottom:3.5rem}
/* TIMELINE */
.tl{display:flex;flex-direction:column}
.tl-item{display:flex;gap:1.25rem}
.tl-gutter{display:flex;flex-direction:column;align-items:center;padding-top:4px;width:14px;flex-shrink:0}
.tl-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}
.tl-line{width:0.5px;flex:1;background:var(--border);margin-top:5px}
.tl-body{flex:1;padding-bottom:2.5rem}
.tl-date{font-family:var(--font-mono);font-size:10px;color:var(--hint);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:5px}
.tl-title{font-size:16px;font-weight:600;margin-bottom:3px}
.tl-org{font-size:13px;color:var(--muted);margin-bottom:1rem}
.tl-client{font-family:var(--font-mono);font-size:10px;font-weight:500;color:var(--accent2);letter-spacing:0.08em;text-transform:uppercase;margin:1rem 0 8px}
.tl-list{list-style:none;padding:0;display:flex;flex-direction:column;gap:5px}
.tl-list li{font-size:13.5px;color:var(--muted);line-height:1.65;padding-left:18px;position:relative;font-weight:300}
.tl-list li::before{content:'›';position:absolute;left:0;color:var(--accent);font-size:15px;line-height:1.5}
